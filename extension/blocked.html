    <main>

        <span class="brand">

            <svg

              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"

            </svg>
          </span>
          <span>unhook<span class="brand-period">.</span></span>
        </span>
      </header>
      <section id="pause" aria-labelledby="pause-heading">
        <svg
          class="unhook-scene"
          viewBox="0 0 320 200"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path

            stroke-width="2.5"
            stroke-linecap="round"
          />

            <g class="leaf">
              <path
                d="M0 26C-29 10-28-24 5-36c22-8 35-7 49-20 3 26-2 58-29 75C16 25 7 28 0 26Z"
                fill="currentColor"
              />

                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />

          </g>
        </svg>
        <h1 id="pause-heading">This can wait.</h1>
        <p id="block-context" class="block-context" role="status">
          <span class="context-line" data-context-summary>Take a moment.</span>
          <span class="context-line" data-context-detail>Then close this tab.</span>
        </p>
        <button type="button" data-close>Close tab</button>
