[package]
name = "unhook-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Unhook cross-platform focus desktop app"

[lib]
name = "unhook_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "unhook"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
unhook-core = { path = "../crates/unhook-core" }

tempfile = "3"
dirs = "7"
